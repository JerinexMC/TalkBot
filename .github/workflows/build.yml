name: Build TalkBot
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn -B clean package
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: TalkBot-plugin
          path: target/TalkBot-0.1.0.jar
